name: PLANETREX real-browser smoke tests
on:
  push:
    branches: [main]
    paths:
      - "backend/app/web/**"
      - "backend/app/main.py"
      - "backend/tests/browser_smoke.py"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and Chromium automation
        run: |
          python -m pip install -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Check real desktop and mobile browser interactions
        run: cd backend && python tests/browser_smoke.py
        env:
          APP_ENV: testing
          PLAYWRIGHT_SCREENSHOTS: ${{ github.workspace }}/browser-shots
      - name: Save actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planetrex-browser-visual-tests
          path: browser-shots/
          if-no-files-found: warn
