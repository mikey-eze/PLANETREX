name: PLANETREX integrity checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test science integrity and service routes
        run: cd backend && python -m pytest -q
      - name: Validate browser JavaScript syntax
        run: node --check backend/app/web/explorer.js
