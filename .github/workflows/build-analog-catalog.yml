name: Build PLANETREX analog catalog
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/app/pipeline/build_analog_catalog.py'
      - 'backend/app/api/routes/deep_comparison.py'
      - 'backend/tests/test_analog_catalog.py'
      - 'data/terrain_survey.json'
      - 'data/earth_science_profiles.json'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate scientific invariants
        working-directory: backend
        run: python -m pytest -q tests/test_analog_catalog.py
      - name: Generate saved discovery catalog
        working-directory: backend
        run: python -m app.pipeline.build_analog_catalog --output ../data/analog_catalog.json
      - name: Publish downloadable batch output
        uses: actions/upload-artifact@v4
        with:
          name: planetrex-analog-catalog
          path: data/analog_catalog.json
          if-no-files-found: error
